<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses | EarlyCraft</title>

  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="styles/courses.css" />

  <script>
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    window.scrollTo(0, 0);
  </script>
</head>
<body>

  <div class="noise" aria-hidden="true"></div>

  <header class="navbar-wrapper">
    <nav class="navbar-container">
      <a href="javascript:void(0)" class="nav-brand-text" id="brandCoursesLink" style="text-decoration: none; cursor: pointer;">Courses</a>

      <button class="mobile-nav-toggle" id="mobileNavToggle" type="button" aria-label="Toggle Navigation" aria-expanded="false">
        <i class="fa-solid fa-bars" id="toggleIcon"></i>
      </button>

      <ul class="nav-links" id="navLinks" style="margin-left: auto;">
        <li><a href="index.html" class="nav-item-link">Home</a></li>
        <li><a href="about.html" class="nav-item-link">About</a></li>
        <li><a href="internship.html" class="nav-item-link">Internship</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hub" id="hub">
      <div class="hero">
        <div>
          <h1>Turn the Page.<br><span>Build Skill.</span></h1>
        </div>
        <div class="icon-field" aria-label="Interactive technology icons">
          <span class="floating-icon" style="--float-color:#e34f26;top:8%;left:8%" title="HTML"><i class="fa-brands fa-html5"></i></span>
          <span class="floating-icon" style="--float-color:#1572b6;bottom:4%;left:21%" title="CSS"><i class="fa-brands fa-css3-alt"></i></span>
          <span class="floating-icon" style="--float-color:#f7df1e;top:35%;left:35%" title="JavaScript"><i class="fa-brands fa-js"></i></span>
          <span class="floating-icon" style="--float-color:#38bdf8;top:2%;left:54%" title="Python"><i class="fa-brands fa-python"></i></span>
          <span class="floating-icon" style="--float-color:#f89820;bottom:1%;left:49%" title="Java"><i class="fa-brands fa-java"></i></span>
          <span class="floating-icon" style="--float-color:#f05032;top:57%;right:25%" title="Git"><i class="fa-brands fa-git-alt"></i></span>
          <span class="floating-icon" style="--float-color:#cbd5e1;top:18%;right:12%" title="GitHub"><i class="fa-brands fa-github"></i></span>
          <span class="floating-icon" style="--float-color:#64748b;bottom:6%;right:5%" title="SQL and databases"><i class="fa-solid fa-database"></i></span>
        </div>
      </div>

      <div class="course-grid" id="courseGrid" aria-label="Available courses"></div>
    </section>

    <section class="pathway" id="pathway" aria-live="polite"></section>
  </main>

  <footer>
    <div class="footer-container">
      <div class="footer-brand">
        EarlyCraft EdTech <span>© All Rights Reserved</span>
      </div>
      <div class="footer-contact">
        <a href="tel:+917010885804" class="footer-btn">
          <i class="fa-solid fa-phone"></i> +91 7010885804
        </a>
        <a href="mailto:earlycraftedtech@gmail.com" class="footer-btn">
          <i class="fa-solid fa-envelope"></i> earlycraftedtech@gmail.com
        </a>
      </div>
    </div>
  </footer>

  <script>
    const courses = [
      {
        id: 'python-101',
        title: 'Python Masterclass',
        description: 'Master core execution models, memory mechanics, dynamic typing, complex data structures, and advanced functional patterns.',
        color: '#38bdf8',
        icon: 'fa-brands fa-python',
        agenda: [
          { title: 'CHAPTER 01: Python Runtime & Execution Architecture', topics: ['Execution Model & Bytecode Compilation', 'Core Syntax, Indentation & Lexical Structure', 'Variable Mechanics, Identifiers & Memory Model', 'Type System Architecture & Dynamic Typing'] },
          { title: 'CHAPTER 02: Primitive Data Types & Logical Operations', topics: ['Integers (int) & Arbitrary Precision', 'Floating-Point (float) & IEEE 754 Mechanics', 'Complex Numbers (complex) & Mathematical Operations', 'Booleans (bool) & Truthy/Falsy Evaluation'] },
          { title: 'CHAPTER 03: Comprehensive Operator Framework', topics: ['Arithmetic & Bitwise Operators', 'Comparison & Relational Operators', 'Logical & Boolean Operators', 'Assignment, Identity & Membership Operators'] },
          { title: 'CHAPTER 04: Control Flow & Conditional Branching', topics: ['If, Elif, Else Conditional Trees', 'Ternary Conditional Expressions', 'Structural Pattern Matching (match-case)', 'Nested Decision-Making Architecture'] },
          { title: 'CHAPTER 05: Iteration Mechanisms & Loop Protocols', topics: ['While Loops & Condition-Based Iteration', 'For Loops & Sequence Traversal', 'Loop Control: Break, Continue & Else Clauses', 'Enumerate & Zip Iteration Helpers'] },
          { title: 'CHAPTER 06: Native Sequence Types – Strings (str)', topics: ['String Immutability & Memory Layout', 'Indexing, Slicing & Extended Step Mechanics', 'String Formatting (f-strings, format, %)', 'Advanced String Methods & Parsing'] },
          { title: 'CHAPTER 07: Native Sequence Types – Lists (list)', topics: ['Dynamic Array Architecture', 'List Operations, Slicing & Mutability', 'Comprehensive List Methods', 'List Comprehension Patterns'] },
          { title: 'CHAPTER 08: Native Sequence Types – Tuples (tuple)', topics: ['Immutable Sequence Properties', 'Tuple Packing & Unpacking Dynamics', 'Namedtuples & Structured Records', 'Tuple Performance vs Lists'] },
          { title: 'CHAPTER 09: Native Set Types (set & frozenset)', topics: ['Hash Table Underlying Structure', 'Set Operations: Union, Intersection & Difference', 'Set Comprehensions & Uniqueness Guarantees', 'Frozenset Immutable Properties'] },
          { title: 'CHAPTER 10: Native Mapping Types – Dictionaries (dict)', topics: ['Hash Map Architecture & Key Constraints', 'Dictionary Access, Insertion & Deletion Methods', 'Dictionary Merging, Updating & Comprehensions', 'Defaultdict, Counter & Ordered Maps'] }
        ]
      },
      {
        id: 'java-101',
        title: 'Java Engineering',
        description: 'Explore JVM compilation pipelines, heap/stack memory management, explicit casting, and enterprise object references.',
        color: '#f89820',
        icon: 'fa-brands fa-java',
        agenda: [
          { title: 'CHAPTER 01: JVM Architecture & Program Structure', topics: ['JVM, JRE & JDK Mechanics', 'Bytecode Execution & JIT Compiler', 'Class Structure, Package Declarations & Main Method', 'Source File Layout & Compilation Workflow'] },
          { title: 'CHAPTER 02: Lexical Structure, Variables & Primitives', topics: ['Primitive Data Types & Numeric Ranges', 'Memory Stack Allocation for Primitives', 'Literals, Constants (final) & Identifiers', 'Variable Scope & Lifecycle'] },
          { title: 'CHAPTER 03: Operators, Expressions & Evaluation Order', topics: ['Arithmetic & Bitwise Operators', 'Relational & Logical Operators', 'Ternary & Assignment Operators', 'Operator Precedence & Evaluation Rules'] },
          { title: 'CHAPTER 04: Type Conversion, Casting & Promotions', topics: ['Implicit Type Promotion Rules', 'Explicit Casting Mechanics & Precision Loss', 'Primitive Boxing & Unboxing (Wrapper Classes)', 'Numeric Conversions & Overflows'] },
          { title: 'CHAPTER 05: Control Flow & Conditional Logic', topics: ['If, Else-If, Else Decision Trees', 'Switch Statements & Modern Switch Expressions', 'Ternary Logic & Branching Optimization', 'Short-Circuit Evaluation Mechanics'] },
          { title: 'CHAPTER 06: Iteration Mechanisms & Loop Constructs', topics: ['While & Do-While Loops', 'Traditional For Loops & Iteration Controls', 'Enhanced For-Each Loop Syntax', 'Loop Branching: Break, Continue & Labeled Statements'] },
          { title: 'CHAPTER 07: Reference Types & Memory Allocation Mechanics', topics: ['Heap Allocation vs Stack Memory', 'Reference Variables & Null References', 'Garbage Collection Basics & Object Reachability', 'Memory Management Best Practices'] }
        ]
      }
    ];

    const hub = document.getElementById('hub');
    const pathway = document.getElementById('pathway');
    const courseGrid = document.getElementById('courseGrid');
    const mobileNavToggle = document.getElementById('mobileNavToggle');
    const navLinks = document.getElementById('navLinks');
    const brandCoursesLink = document.getElementById('brandCoursesLink');

    // Dynamic Card Rendering
    courseGrid.innerHTML = courses.map(course => `
      <article class="course-card" style="--card-color:${course.color}" data-id="${course.id}">
        <div class="card-head">
          <div class="card-icon"><i class="${course.icon}"></i></div>
          <h2>${course.title}</h2>
          <p class="card-desc">${course.description}</p>
        </div>
        <div class="card-foot">
          <div class="action-btn">Explore Path <i class="fa-solid fa-chevron-right"></i></div>
        </div>
      </article>
    `).join('');

    // Card Tilt Effect & Click Trigger
    document.querySelectorAll('.course-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        card.style.setProperty('--mx', `${x}px`);
        card.style.setProperty('--my', `${y}px`);
        
        const cx = rect.width / 2;
        const cy = rect.height / 2;
        const rx = ((y - cy) / cy) * -8;
        const ry = ((x - cx) / cx) * 8;
        
        card.classList.add('is-tilting');
        card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) translateZ(10px)`;
      });

      card.addEventListener('mouseleave', () => {
        card.classList.remove('is-tilting');
        card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateZ(0px)';
      });

      card.addEventListener('click', () => openCourse(card.dataset.id, true));
    });

    // OPEN COURSE (WITH HISTORY PUSH OPTION)
    function openCourse(id, pushHistory = true) {
      const course = courses.find(c => c.id === id);
      if (!course) return;

      document.body.classList.add('course-open');
      hub.classList.add('is-hidden');
      
      pathway.style.setProperty('--accent', course.color);
      pathway.innerHTML = `
        <div class="path-head">
          <span class="chapter-label">Interactive Syllabus</span>
          <h2>${course.title}</h2>
        </div>
        <div class="timeline">
          <div class="timeline-progress" id="timelineProgress"></div>
          ${course.agenda.map((ch, idx) => `
            <div class="step" data-index="${idx}">
              <div class="step-dot"></div>
              <div class="step-card">
                <div class="chapter-header">
                  <div>
                    <span class="chapter-label">${ch.title.split(':')[0]}</span>
                    <h3>${ch.title.split(':')[1] || ch.title}</h3>
                  </div>
                  <div class="toggle-icon"><i class="fa-solid fa-chevron-down"></i></div>
                </div>
                <div class="concept-wrapper">
                  <ul class="concept-list">
                    ${ch.topics.map(t => `<li>${t}</li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      pathway.classList.add('is-active');
      window.scrollTo(0, 0);
      setupScrollObserver();
      setupAccordion();

      if (pushHistory) {
        const newUrl = `${window.location.pathname}?course=${encodeURIComponent(id)}`;
        history.pushState({ view: 'pathway', courseId: id }, '', newUrl);
      }
    }

    // CLOSE COURSE (WITH HISTORY PUSH OPTION)
    function closeCourse(pushHistory = true) {
      document.body.classList.remove('course-open');
      pathway.classList.remove('is-active');
      hub.classList.remove('is-hidden');
      window.scrollTo(0, 0);

      if (pushHistory) {
        history.pushState({ view: 'hub' }, '', window.location.pathname);
      }
    }

    brandCoursesLink.addEventListener('click', () => closeCourse(true));

    // ACCORDION TOGGLE
    function setupAccordion() {
      document.querySelectorAll('.step-card').forEach(card => {
        card.addEventListener('click', () => {
          card.classList.toggle('active');
        });
      });
    }

    // INTERSECTION & SCROLL PROGRESS OBSERVER
    function setupScrollObserver() {
      const steps = document.querySelectorAll('.step');
      const progressLine = document.getElementById('timelineProgress');

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
          }
        });
      }, { threshold: 0.2 });

      steps.forEach(step => observer.observe(step));

      window.addEventListener('scroll', () => {
        if (!pathway.classList.contains('is-active')) return;
        const timeline = document.querySelector('.timeline');
        if (!timeline) return;

        const rect = timeline.getBoundingClientRect();
        const totalHeight = rect.height;
        const visibleHeight = window.innerHeight / 2 - rect.top;
        const progress = Math.min(Math.max(visibleHeight / totalHeight, 0), 1);

        if (progressLine) {
          progressLine.style.height = `${progress * 100}%`;
        }
      });
    }

    // MOBILE NAVIGATION TOGGLE
    mobileNavToggle.addEventListener('click', () => {
      const isExpanded = mobileNavToggle.getAttribute('aria-expanded') === 'true';
      mobileNavToggle.setAttribute('aria-expanded', !isExpanded);
      navLinks.classList.toggle('active');
      
      const icon = mobileNavToggle.querySelector('i');
      icon.classList.toggle('fa-bars');
      icon.classList.toggle('fa-xmark');
    });

    // INTERNAL LINK TRANSITION HANDLER
    document.querySelectorAll('a[href]').forEach(link => {
      link.addEventListener('click', e => {
        const href = link.getAttribute('href');
        if (href && !href.startsWith('#') && !href.startsWith('javascript') && !href.startsWith('mailto:') && !href.startsWith('tel:')) {
          e.preventDefault();
          document.body.classList.add('page-exit');
          setTimeout(() => {
            window.location.href = href;
          }, 450);
        }
      });
    });

    // SINK ROUTER: INITIAL REFRESH & UNDO/REDO (BACK/FORWARD) LISTENER
    function initRouter() {
      // 1. Listen for browser Back/Forward (Undo/Redo) actions
      window.addEventListener('popstate', (e) => {
        const state = e.state;
        if (state && state.view === 'pathway' && state.courseId) {
          openCourse(state.courseId, false);
        } else {
          const params = new URLSearchParams(window.location.search);
          const courseId = params.get('course');
          if (courseId) {
            openCourse(courseId, false);
          } else {
            closeCourse(false);
          }
        }
      });

      // 2. Read URL Parameters on Page Load / Refresh
      const urlParams = new URLSearchParams(window.location.search);
      const activeCourse = urlParams.get('course');

      if (activeCourse) {
        openCourse(activeCourse, false);
      } else {
        closeCourse(false);
      }
    }

    // Run router on DOM load
    document.addEventListener('DOMContentLoaded', initRouter);
  </script>
</body>
</html>
