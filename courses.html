<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Courses | EarlyCraft</title>
  
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --ink:#0f172a; --muted:#64748b; --night:#f8fafc; --panel:rgba(255,255,255,.78); --line:rgba(15,23,42,.1); --accent:#0284c7; --blue:#2563eb; }
    * { box-sizing:border-box; margin:0; user-select:none; -webkit-user-select:none; -moz-user-select:none; -ms-user-select:none; }
    html { background:var(--night); scroll-behavior:smooth; }
    body { min-height:100vh; overflow-x:hidden; color:var(--ink); background:var(--night); font-family:'Plus Jakarta Sans',sans-serif; transform-origin:center top; animation:pageEnter .75s cubic-bezier(.16,1,.3,1) both; }
    @keyframes pageEnter { from { opacity:1; transform:scale(.96) translateY(24px) rotateX(4deg); filter:blur(12px) brightness(1.1); } to { opacity:1; transform:scale(1) translateY(0) rotateX(0); filter:blur(0) brightness(1); } }
    body.page-loaded { opacity:1; transform:scale(1) translateY(0) rotateX(0); filter:blur(0) brightness(1); }
    body.page-exiting { opacity:0; transform:scale(1.04) translateY(-28px) rotateX(-3deg); filter:blur(14px) brightness(.92); pointer-events:none; transition:opacity .45s cubic-bezier(.7,0,.84,0),transform .45s cubic-bezier(.7,0,.84,0),filter .45s cubic-bezier(.7,0,.84,0); }
    button { font:inherit; }
    .noise { position:fixed; inset:0; pointer-events:none; opacity:.04; z-index:10; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E"); }
    .navbar-wrapper { position:fixed; top:0; left:0; width:100%; height:80px; z-index:20; display:flex; justify-content:center; align-items:center; padding:0 5%; }
    .navbar-container { width:100%; max-width:1300px; height:60px; padding:0 1.5rem; display:flex; align-items:center; justify-content:space-between; position:relative; border:1px solid rgba(15,23,42,.08); border-radius:50px; background:rgba(255,255,255,.85); backdrop-filter:blur(20px) saturate(180%); box-shadow:0 10px 30px -10px rgba(15,23,42,.05),0 0 0 1px rgba(255,255,255,.6) inset; }
    .nav-brand { display:flex; align-items:center; gap:10px; text-decoration:none; }
    .nav-brand-logo { height:36px; width:auto; object-fit:contain; border-radius:8px; }
    .nav-brand-font { height:28px; width:auto; object-fit:contain; display:block; }
    .nav-links { display:flex; align-items:center; gap:.5rem; list-style:none; }
    .nav-item-link { padding:.55rem 1.25rem; color:#475569; text-decoration:none; font-weight:600; font-size:.92rem; border-radius:30px; transition:all .3s cubic-bezier(.16,1,.3,1); }
    .nav-item-link:hover { color:#0284c7; background:rgba(2,132,199,.06); }
    .nav-item-link.active { color:#fff; background:linear-gradient(135deg,#0284c7 0%,#2563eb 100%); box-shadow:0 4px 14px rgba(37,99,235,.35); }
    .mobile-nav-toggle { display:none; padding:8px; color:var(--ink); background:transparent; border:0; border-radius:50%; cursor:pointer; font-size:1.35rem; }
    .mobile-nav-toggle:hover { color:#0284c7; background:rgba(2,132,199,.08); }
    .course-open .nav-links, .course-open .mobile-nav-toggle { display:none!important; }
    .course-nav-button { position:relative; z-index:1001; display:none; align-items:center; gap:8px; padding:.55rem 1.15rem; color:#fff; border:0; border-radius:30px; background:linear-gradient(135deg,#0284c7 0%,#2563eb 100%); box-shadow:0 4px 14px rgba(37,99,235,.25); cursor:pointer; font-size:.86rem; font-weight:700; transition:transform .3s ease,box-shadow .3s ease,filter .3s ease; }
    .course-nav-button:hover { transform:translateY(-2px) scale(1.03); filter:saturate(1.15); box-shadow:0 8px 20px rgba(37,99,235,.35); }
    .course-nav-button:active { transform:translateY(0) scale(.98); }
    .course-open .course-nav-button { display:inline-flex; }
    .eyebrow { color:var(--accent); font:500 .7rem 'DM Mono',monospace; letter-spacing:.18em; text-transform:uppercase; }
    .hub, .pathway { transition:opacity .55s ease, transform .75s cubic-bezier(.16,1,.3,1); }
    .hub { padding:148px 6vw 100px; max-width:1500px; margin:auto; }
    .hub.is-hidden { opacity:0; transform:translateY(-22px) rotateX(-7deg); pointer-events:none; position:absolute; width:100%; }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,.72fr); align-items:center; gap:30px; margin-bottom:72px; }
    h1 { max-width:800px; margin-top:14px; color:var(--ink); font-size:clamp(2.8rem,6vw,5.8rem); font-weight:800; line-height:1; letter-spacing:.018em; }
    h1 span { background:linear-gradient(135deg,#0284c7 0%,#2563eb 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .icon-field { position:relative; min-height:280px; overflow:visible; padding:10px 14px; perspective:800px; }
    .floating-icon { --float-color:#0284c7; position:absolute; width:clamp(46px,4vw,58px); height:clamp(46px,4vw,58px); display:grid; place-items:center; color:var(--float-color); font-size:clamp(1.05rem,1.7vw,1.4rem); border:1px solid color-mix(in srgb,var(--float-color),transparent 55%); border-radius:17px; background:rgba(255,255,255,.82); box-shadow:0 14px 30px rgba(15,23,42,.1); animation:iconFloat 6s ease-in-out infinite; transition:transform .35s,box-shadow .35s,background .35s; }
    .floating-icon:hover { z-index:2; color:#fff; background:var(--float-color); transform:translateY(-8px) rotate(8deg) scale(1.12); box-shadow:0 18px 28px color-mix(in srgb,var(--float-color),transparent 65%); }
    .floating-icon:nth-child(3n) { animation-delay:-2s; }
    .floating-icon:nth-child(4n) { animation-delay:-4.5s; }
    @keyframes iconFloat { 0%,100% { transform:translate3d(0,0,0) rotate(-3deg); } 50% { transform:translate3d(8px,-14px,20px) rotate(4deg); } }
    .course-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; perspective:1400px; }
    .course-card { --card-color:#0284c7; --mx:50%; --my:50%; position:relative; min-height:285px; padding:25px 22px; display:flex; flex-direction:column; justify-content:space-between; overflow:hidden; color:var(--ink); text-align:left; cursor:pointer; border:1px solid rgba(15,23,42,.1); border-radius:14px; background:linear-gradient(145deg,rgba(255,255,255,.94),rgba(241,245,249,.74)); box-shadow:0 22px 45px rgba(15,23,42,.09),0 1px 0 rgba(255,255,255,.9) inset; transform:rotateX(0) rotateY(0) translateZ(0); transform-style:preserve-3d; transition:transform .18s ease-out,box-shadow .35s ease,border-color .35s ease; will-change:transform; }
    .course-card::before { content:''; position:absolute; inset:0; z-index:0; pointer-events:none; background:radial-gradient(circle at var(--mx) var(--my),color-mix(in srgb,var(--card-color),transparent 74%),transparent 38%); opacity:0; transition:opacity .3s; }
    .course-card::after { content:''; position:absolute; width:150px; height:150px; right:-60px; bottom:-70px; border-radius:50%; background:var(--card-color); filter:blur(42px); opacity:.22; transition:opacity .4s,transform .4s; }
    .course-card:hover { border-color:var(--card-color); box-shadow:0 25px 45px rgba(15,23,42,.16),0 0 30px color-mix(in srgb,var(--card-color),transparent 78%); }
    .course-card.is-tilting::before { opacity:1; }
    .course-card:hover::after { opacity:.48; transform:scale(1.3); }
    .card-icon { width:48px; height:48px; display:grid; place-items:center; color:var(--card-color); font-size:1.3rem; border:1px solid color-mix(in srgb,var(--card-color),transparent 55%); border-radius:50%; }
    .course-card h2 { position:relative; z-index:1; font-size:clamp(1rem,1.4vw,1.3rem); letter-spacing:-.04em; line-height:1.1; }
    .card-foot { position:relative; z-index:1; display:flex; justify-content:flex-end; }
    .action-badge { min-width:clamp(124px,10vw,148px); height:clamp(42px,3.5vw,48px); padding:0 clamp(11px,1.2vw,17px); display:flex; flex-direction:row; align-items:center; justify-content:center; gap:clamp(7px,1vw,10px); color:#fff; font-size:clamp(.62rem,.75vw,.75rem); font-weight:800; letter-spacing:.03em; line-height:1.1; text-align:center; text-transform:uppercase; border-radius:12px; background:var(--card-color); box-shadow:0 9px 20px color-mix(in srgb,var(--card-color),transparent 55%); transition:transform .35s,box-shadow .35s; }
    .action-badge i { font-size:.95rem; transition:transform .35s; }
    .course-card:hover .action-badge { transform:translateY(-6px) rotate(7deg) scale(1.06); box-shadow:0 15px 25px color-mix(in srgb,var(--card-color),transparent 40%); }
    .course-card:hover .action-badge i { transform:translate(3px,-3px); }
    .pathway { display:none; padding:130px 6vw 150px; max-width:1200px; margin:auto; }
    .pathway.is-active { display:block; animation:openBook .9s cubic-bezier(.16,1,.3,1) both; }
    .pathway.is-closing { display:none !important; }
    @keyframes openBook { from { opacity:0; transform:perspective(1200px) rotateX(-12deg) translateY(50px); } to { opacity:1; transform:perspective(1200px) rotateX(0) translateY(0); } }
    .path-head { position:relative; padding-bottom:62px; text-align:center; }
    .path-head h2 { margin:0 auto 12px; max-width:780px; font-size:clamp(2.4rem,5.5vw,5.2rem); line-height:1.05; letter-spacing:-.055em; }
    .back-button { position:fixed; top:18px; right:calc(5% + 1.5rem); z-index:25; display:none; width:48px; height:48px; place-items:center; color:#fff; cursor:pointer; border:0; border-radius:50%; background:linear-gradient(135deg,#0284c7,#2563eb); box-shadow:0 8px 20px rgba(37,99,235,.28); transition:transform .3s,box-shadow .3s; }
    .back-button:hover { transform:translateX(-4px) scale(1.1); box-shadow:0 12px 25px rgba(37,99,235,.38); }
    .pathway.is-active ~ .back-button { display:grid; }
    .timeline { position:relative; padding:25px 0; }
    .timeline::before, .timeline-progress { content:''; position:absolute; top:0; bottom:0; left:50%; width:2px; transform:translateX(-50%); pointer-events:none; }
    .timeline::before { background:rgba(15,23,42,.14); }
    .timeline-progress { height:0; bottom:auto; background:var(--accent); box-shadow:0 0 16px var(--accent),0 0 32px var(--accent); transition:height .25s linear; }
    .step { position:relative; width:50%; padding:30px 0; opacity:.25; transform:translateY(34px); transition:opacity .6s ease,transform .7s cubic-bezier(.16,1,.3,1); }
    .step:nth-child(odd) { padding-right:1.5%; text-align:right; }
    .step:nth-child(even) { margin-left:50%; padding-left:1.5%; }
    .step.revealed { opacity:1; transform:translateY(0); }
    .step-dot { position:absolute; top:39px; width:14px; height:14px; border:3px solid var(--night); border-radius:50%; background:#cbd5e1; box-shadow:0 0 0 1px #94a3b8; transition:background .4s,box-shadow .4s; }
    .step:nth-child(odd) .step-dot { right:-7px; }
    .step:nth-child(even) .step-dot { left:-7px; }
    .step.revealed .step-dot { background:var(--accent); box-shadow:0 0 0 5px color-mix(in srgb,var(--accent),transparent 78%),0 0 20px var(--accent); }
    .step-card { min-height:0; height:auto; padding:clamp(24px,3vw,38px); text-align:left; border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:14px; background:rgba(255,255,255,.82); box-shadow:0 18px 30px rgba(15,23,42,.09); }
    .step:nth-child(odd) .step-card { text-align:left; }
    .chapter-label { display:block; color:var(--accent); font:600 clamp(.68rem,.85vw,.82rem) 'DM Mono',monospace; letter-spacing:.14em; line-height:1.35; text-transform:uppercase; }
    .step-number { color:var(--accent); font:500 clamp(.62rem,.78vw,.76rem) 'DM Mono',monospace; letter-spacing:.14em; }
    .step-card h3 { margin:16px 0 16px; font-size:clamp(1.2rem,1.9vw,1.7rem); letter-spacing:.005em; line-height:1.2; }
    .concept-list { display:flex; flex-wrap:wrap; gap:7px; list-style:none; }
    .concept-list li { padding:clamp(8px,.9vw,12px) clamp(10px,1.1vw,15px); color:var(--muted); font-size:clamp(.82rem,1.05vw,1rem); line-height:1.3; border:1px solid rgba(15,23,42,.08); border-radius:8px; background:rgba(248,250,252,.9); }
    .finish { padding-top:90px; text-align:center; }
    .finish i { color:var(--accent); font-size:2rem; }
    .finish p { margin-top:18px; color:var(--muted); }
    .footer-bar { width:84%; max-width:1400px; margin:1.5rem auto 2.5rem; padding:.85rem 2rem; display:flex; align-items:center; justify-content:space-between; color:#64748b; font-size:.85rem; border:1px solid rgba(15,23,42,.08); border-radius:50px; background:rgba(255,255,255,.85); backdrop-filter:blur(16px); box-shadow:0 4px 20px rgba(15,23,42,.04); }
    .footer-rights { display:flex; align-items:center; gap:6px; }
    .footer-brand { color:var(--ink); font-weight:700; }
    .footer-contacts { display:flex; gap:1rem; }
    .footer-pill { display:inline-flex; align-items:center; gap:8px; padding:.4rem 1rem; color:var(--ink); text-decoration:none; font-weight:600; border:1px solid rgba(15,23,42,.08); border-radius:30px; background:rgba(255,255,255,.8); transition:all .3s ease; }
    .footer-pill:hover { color:#0284c7; border-color:#0284c7; background:#fff; transform:translateY(-2px); box-shadow:0 4px 12px rgba(2,132,199,.12); }
    .footer-pill i { color:#0284c7; }
    @media (max-width:1050px) { .course-grid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:768px) {
      .navbar-wrapper { height:70px; padding:0 4%; }
      .navbar-container { padding:0 1.2rem; }
      .mobile-nav-toggle { display:block; }
      .nav-brand-font { height:22px; }
      .nav-links { position:absolute; top:70px; right:0; width:240px; background:rgba(255,255,255,.95); backdrop-filter:blur(25px) saturate(180%); -webkit-backdrop-filter:blur(25px) saturate(180%); border:1px solid rgba(15,23,42,.08); border-radius:20px !important; box-shadow:0 15px 35px rgba(15,23,42,.12); flex-direction:column; padding:1rem; gap:.5rem; opacity:0; visibility:hidden; transform:translateY(-12px) scale(.95); transition:all .3s cubic-bezier(.16,1,.3,1); z-index:1000; }
      .nav-links.active { opacity:1; visibility:visible; transform:translateY(0) scale(1); }
      .nav-links li { width:100%; }
      .nav-item-link { display:block; width:100%; text-align:center; padding:.75rem 1rem; }
      .course-open .course-nav-button { display:inline-flex; margin-left:auto; }
      .hub { padding:112px 6vw 70px; }
      .hero { display:block; margin-bottom:42px; }
      h1 { font-size:clamp(2.5rem,11vw,4.4rem); letter-spacing:.01em; }
      .icon-field { min-height:250px; margin-top:28px; }
      .course-grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; max-width:100%; margin:0 auto; }
      .course-card { min-height:clamp(215px,58vw,270px); padding:16px 12px; }
      .course-card h2 { font-size:clamp(.88rem,3.8vw,1.12rem); }
      .action-badge { min-width:0; width:100%; height:clamp(38px,10vw,46px); padding:0 8px; gap:6px; font-size:clamp(.52rem,2.2vw,.68rem); }
      .pathway { padding:110px 7vw 90px; }
      .path-head { text-align:left; padding-bottom:38px; }
      .timeline::before, .timeline-progress { left:9px; transform:none; }
      .step, .step:nth-child(even) { width:100%; margin-left:0; padding:22px 0 22px 42px; text-align:left; }
      .step:nth-child(odd) { padding:22px 0 22px 42px; text-align:left; }
      .step-dot, .step:nth-child(odd) .step-dot, .step:nth-child(even) .step-dot { left:2px; right:auto; }
      .step-card, .step:nth-child(odd) .step-card { text-align:left; }
      .step-card { min-height:0; height:auto; padding:clamp(22px,6vw,30px); }
      .back-button { right:6vw; top:14px; }
      .footer-bar { width:92%; flex-direction:column; gap:.8rem; padding:.8rem 1.2rem; border-radius:20px; text-align:center; }
      .footer-contacts { gap:.6rem; flex-wrap:wrap; justify-content:center; }
      .footer-pill { padding:.3rem .8rem; font-size:.78rem; }
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; scroll-behavior:auto!important; } }
  </style>
</head>

  <script>
    const courses = [
  { id:'python-101', title:'Python Masterclass', color:'#3776ab', icon:'fa-brands fa-python', agenda:[
    { title:'CHAPTER 01: Python Runtime & Execution Architecture', topics:['Execution Model & Bytecode Compilation','Core Syntax, Indentation & Lexical Structure','Variable Mechanics, Identifiers & Memory Model','Type System Architecture & Dynamic Typing'] },
    { title:'CHAPTER 02: Primitive Data Types & Logical Operations', topics:['Integers (int) & Arbitrary Precision','Floating-Point (float) & IEEE 754 Mechanics','Complex Numbers (complex) & Mathematical Operations','Booleans (bool) & Truthy/Falsy Evaluation'] },
    { title:'CHAPTER 03: Comprehensive Operator Framework', topics:['Arithmetic & Bitwise Operators','Comparison & Relational Operators','Logical & Boolean Operators','Assignment, Identity & Membership Operators'] },
    { title:'CHAPTER 04: Control Flow & Conditional Branching', topics:['If, Elif, Else Conditional Trees','Ternary Conditional Expressions','Structural Pattern Matching (match-case)','Nested Decision-Making Architecture'] },
    { title:'CHAPTER 05: Iteration Mechanisms & Loop Protocols', topics:['While Loops & Condition-Based Iteration','For Loops & Sequence Traversal','Loop Control: Break, Continue & Else Clauses','Enumerate & Zip Iteration Helpers'] },
    { title:'CHAPTER 06: Native Sequence Types – Strings (str)', topics:['String Immutability & Memory Layout','Indexing, Slicing & Extended Step Mechanics','String Formatting (f-strings, format, %)', 'Advanced String Methods & Parsing'] },
    { title:'CHAPTER 07: Native Sequence Types – Lists (list)', topics:['Dynamic Array Architecture','List Operations, Slicing & Mutability','Comprehensive List Methods','List Comprehension Patterns'] },
    { title:'CHAPTER 08: Native Sequence Types – Tuples (tuple)', topics:['Immutable Sequence Properties','Tuple Packing & Unpacking Dynamics','Namedtuples & Structured Records','Tuple Performance vs Lists'] },
    { title:'CHAPTER 09: Native Set Types (set & frozenset)', topics:['Hash Table Underlying Structure','Set Operations: Union, Intersection & Difference','Set Comprehensions & Uniqueness Guarantees','Frozenset Immutable Properties'] },

    const grid = document.querySelector('#courseGrid');
    const hub = document.querySelector('#hub');
    const pathway = document.querySelector('#pathway');
    const courseNavButton = document.querySelector('#courseNavButton');
    let activeCourse = null;
    let observer;
    let progressFrame = 0;
    function chapterMarkup(chapter) {
      const separator = chapter.title.indexOf(':');
      const label = separator > -1 ? chapter.title.slice(0, separator) : '';
      const title = separator > -1 ? chapter.title.slice(separator + 1).trim() : chapter.title;
      return `<span class="chapter-label">${label}</span><h3>${title}</h3>`;
    }
    grid.innerHTML = courses.map(course => `<button class="course-card" type="button" data-course="${course.id}" style="--card-color:${course.color}"><span class="card-icon"><i class="${course.icon}"></i></span><h2>${course.title}</h2><span class="card-foot"><span class="action-badge">Open chapter <i class="fa-solid fa-arrow-up-right"></i></span></span></button>`).join('');

    function openCourse(course) {
      activeCourse = course;
      pathway.classList.remove('is-closing');
      document.body.classList.add('course-open');
      document.documentElement.style.setProperty('--accent', course.color);
      pathway.innerHTML = `<div class="path-head"><h2>${course.title}</h2></div><div class="timeline"><div class="timeline-progress"></div>${course.agenda.map(chapter => `<article class="step"><span class="step-dot"></span><div class="step-card">${chapterMarkup(chapter)}<ul class="concept-list">${chapter.topics.map(topic => `<li>${topic}</li>`).join('')}</ul></div></article>`).join('')}</div><div class="finish"><i class="fa-solid fa-star"></i></div>`;
      hub.classList.add('is-hidden');
      pathway.classList.add('is-active');
      window.scrollTo({ top:0, behavior:'smooth' });
      observer = new IntersectionObserver(entries => entries.forEach(entry => entry.isIntersecting && entry.target.classList.add('revealed')), { threshold:.28 });
      pathway.querySelectorAll('.step').forEach(step => observer.observe(step));
      window.addEventListener('scroll', scheduleProgress, { passive:true });
      updateProgress();
    }
    function scheduleProgress() {
      if (progressFrame) return;
      progressFrame = requestAnimationFrame(() => {
        progressFrame = 0;
        updateProgress();
      });
    }
    function updateProgress() {
      if (!activeCourse) return;
      const timeline = pathway.querySelector('.timeline');
      const progress = pathway.querySelector('.timeline-progress');
      const bounds = timeline.getBoundingClientRect();
      const amount = Math.min(1, Math.max(0, (window.innerHeight * .58 - bounds.top) / bounds.height));
      progress.style.height = `${amount * 100}%`;
      pathway.querySelectorAll('.step').forEach(step => {
        if (step.getBoundingClientRect().top < window.innerHeight * .82) step.classList.add('revealed');
      });
    }
    function closeCourse() {
      if (!activeCourse) return;
      if (observer) observer.disconnect();
      window.removeEventListener('scroll', scheduleProgress);
      if (progressFrame) cancelAnimationFrame(progressFrame);
      progressFrame = 0;
      document.documentElement.style.scrollBehavior = 'auto';
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
      document.body.classList.remove('course-open');
      hub.classList.remove('is-hidden');
      pathway.classList.remove('is-active', 'is-closing');
      activeCourse = null;
      document.documentElement.style.scrollBehavior = 'smooth';
    }
    grid.addEventListener('click', event => { const card = event.target.closest('[data-course]'); if (card) openCourse(courses.find(course => course.id === card.dataset.course)); });
    grid.querySelectorAll('.course-card').forEach(card => {
      card.addEventListener('pointermove', event => {
        if (event.pointerType === 'touch') return;
        const bounds = card.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width;
        const y = (event.clientY - bounds.top) / bounds.height;
        card.style.setProperty('--mx', `${x * 100}%`);
        card.style.setProperty('--my', `${y * 100}%`);
        card.style.transform = `perspective(900px) rotateX(${(0.5 - y) * 9}deg) rotateY(${(x - 0.5) * 11}deg) translateY(-8px) translateZ(8px)`;
        card.classList.add('is-tilting');
      });
      card.addEventListener('pointerleave', () => {
        card.style.transform = '';
        card.classList.remove('is-tilting');
      });
    });
    const mobileNavToggle = document.querySelector('#mobileNavToggle');
    const navLinks = document.querySelector('#navLinks');
    mobileNavToggle.addEventListener('click', () => {
      const isOpen = navLinks.classList.toggle('active');
      mobileNavToggle.setAttribute('aria-expanded', String(isOpen));
      document.querySelector('#toggleIcon').className = isOpen ? 'fa-solid fa-xmark' : 'fa-solid fa-bars';
    });
    navLinks.querySelectorAll('a').forEach(link => link.addEventListener('click', () => {
      navLinks.classList.remove('active');
      mobileNavToggle.setAttribute('aria-expanded', 'false');
      document.querySelector('#toggleIcon').className = 'fa-solid fa-bars';
    }));
    courseNavButton.addEventListener('click', closeCourse);
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && activeCourse) closeCourse(); });
    document.querySelectorAll('a.nav-brand, a.nav-item-link').forEach(link => link.addEventListener('click', () => document.body.classList.add('page-exiting')));
    function revealPage() {
      window.scrollTo(0, 0);
      requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('page-loaded')));
      setTimeout(() => document.body.classList.add('page-loaded'), 80);
    }
    revealPage();
    window.addEventListener('load', revealPage, { once:true });
  </script>
